name: athena-persistence-development

# Development and contract testing only. This file is not production acceptance
# evidence and deliberately exposes no service port to the host.
services:
  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ATHENA_POSTGRES_DB:?required}
      POSTGRES_USER: ${ATHENA_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${ATHENA_POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations/postgres:/athena-migrations:ro
      - ./postgres-init/0000_apply_approved_migrations.sql:/docker-entrypoint-initdb.d/0000_apply_approved_migrations.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [persistence]

  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${ATHENA_REDIS_PASSWORD:?required}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    tmpfs:
      - /data
    networks: [persistence]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ATHENA_MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${ATHENA_MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [persistence]

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${ATHENA_MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${ATHENA_MINIO_ROOT_PASSWORD:?required}
      ATHENA_OBJECT_BUCKET: ${ATHENA_OBJECT_BUCKET:?required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$ATHENA_OBJECT_BUCKET"
        mc version enable "local/$$ATHENA_OBJECT_BUCKET"
        mc anonymous set none "local/$$ATHENA_OBJECT_BUCKET"
    networks: [persistence]

networks:
  persistence:
    internal: true

volumes:
  postgres-data:
  minio-data:
