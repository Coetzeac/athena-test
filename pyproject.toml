[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-research-os"
version = "0.1.0"
description = "Evidence-governed quantitative research operating system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Antonie Coetzee"}]
dependencies = []

[project.optional-dependencies]
persistence = [
  "boto3==1.43.72",
  "psycopg[binary]==3.3.4",
  "redis==8.1.0",
]

[project.scripts]
athena = "athena.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
