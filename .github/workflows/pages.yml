name: ATHENA Status Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "runtime/status.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static status site
        run: |
          mkdir -p _site/runtime
          cp dashboard/index.html dashboard/styles.css dashboard/app.js _site/
          cp runtime/status.json _site/runtime/status.json
          sed -i 's#../runtime/status.json#./runtime/status.json#' _site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4

