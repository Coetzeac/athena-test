name: ATHENA Hourly Research Cycle

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: athena-research-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATHENA
        run: python -m pip install -e .
      - name: Prove kernel before research
        run: python -m unittest discover -s tests -v
      - name: Run governed research cycle
        run: athena run examples/orb_candidate.json --ledger runtime/ledger.jsonl --status runtime/status.json
      - name: Validate audit chain
        run: athena validate-ledger runtime/ledger.jsonl
      - name: Preserve changed audit state
        run: |
          git config user.name "athena-research-bot"
          git config user.email "athena-research-bot@users.noreply.github.com"
          git add runtime/ledger.jsonl runtime/status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(runtime): record governed research cycle [skip ci]"
          git push
      - name: Upload cycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: athena-cycle-${{ github.run_id }}
          path: |
            runtime/ledger.jsonl
            runtime/status.json
          retention-days: 90
