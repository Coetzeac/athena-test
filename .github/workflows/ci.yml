name: ATHENA CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATHENA
        run: python -m pip install -e .
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate frozen architecture and traceability
        run: athena freeze-status
      - name: Run governed example cycle
        run: athena run examples/orb_candidate.json --ledger /tmp/athena-ledger.jsonl --register /tmp/athena-evidence-register.jsonl --status /tmp/athena-status.json
      - name: Validate audit ledger
        run: athena validate-ledger /tmp/athena-ledger.jsonl
      - name: Reconcile evidence register and audit ledger
        run: athena validate-register /tmp/athena-evidence-register.jsonl --ledger /tmp/athena-ledger.jsonl
      - name: Run controlled research intake
        run: athena ingest-paper examples/research_intake/har_rv_synthetic_intake.json --objects /tmp/athena-objects --register /tmp/athena-evidence-register.jsonl --quarantine /tmp/athena-intake-quarantine.jsonl --ledger /tmp/athena-ledger.jsonl
      - name: Validate source retention, claim links, quarantine, register, and ledger
        run: athena validate-intake --objects /tmp/athena-objects --register /tmp/athena-evidence-register.jsonl --quarantine /tmp/athena-intake-quarantine.jsonl --ledger /tmp/athena-ledger.jsonl
      - name: Run controlled synthetic market-data intake
        run: athena ingest-market-fixture examples/market_data/twelve_data_synthetic_daily.json GBP/USD 1day --start 2026-08-03 --end 2026-08-07 --objects /tmp/athena-market-data-objects --register /tmp/athena-evidence-register.jsonl --quarantine /tmp/athena-market-data-quarantine.jsonl --ledger /tmp/athena-ledger.jsonl
      - name: Validate market-data bytes, fingerprints, quarantine, register, and ledger
        run: athena validate-market-data --objects /tmp/athena-market-data-objects --register /tmp/athena-evidence-register.jsonl --quarantine /tmp/athena-market-data-quarantine.jsonl --ledger /tmp/athena-ledger.jsonl
      - name: Build an immutable bounded historical-acquisition manifest
        run: athena plan-market-history --start 2020-01-01 --end 2020-01-02 --symbol BTC/USD --interval 1day --manifest-root /tmp/athena-history-control
      - name: Validate runtime-persistence contracts and recovery objectives
        run: athena validate-runtime-persistence
      - name: Prove synthetic byte-for-byte backup and restore
        run: athena prove-runtime-recovery examples/recovery/synthetic_runtime_backup.json --store-root /tmp/athena-recovery-proof
