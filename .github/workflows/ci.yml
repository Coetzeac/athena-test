name: ATHENA CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATHENA
        run: python -m pip install -e .
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Run governed example cycle
        run: athena run examples/orb_candidate.json --ledger /tmp/athena-ledger.jsonl --status /tmp/athena-status.json
      - name: Validate audit ledger
        run: athena validate-ledger /tmp/athena-ledger.jsonl
